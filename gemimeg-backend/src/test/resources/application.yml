server:
  port: 10001
  ssl:
    enabled: false
  forward-headers-strategy: FRAMEWORK
  error:
    include-message: always
log4j:
  appender:
    consoleAppender: org.apache.log4j.ConsoleAppender
spring:
  profiles:
    active: user-${USERNAME}
  application:
    name: gemimeg-backend
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  main:
    lazy-initialization: true
    allow-bean-definition-overriding: true
  data:
    mongodb:
      database: ${spring.application.name}
      port: 27017
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 8.0.0
common:
  security:
    enabled: ${server.ssl.enabled}
  dcc:
    schema-url: '@dcc-schema-url@'
    namespace-uri: '@dcc-namespace-uri@'
    persist-enabled: false
    persist-lifespan: 600
  cache:
    persist-lifespan: 600
